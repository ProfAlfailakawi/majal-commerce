<!doctype html>
<!--
  صفحة التحديث: «تُفتح البوابة من جديد بعد قليل».

  أثناء النشر يتبدّل الخادم، فتجيب واجهةُ Google الأماميّة عن التنقّل بصفحة خطأٍ
  إنجليزية (500/502/503/504) لا يكتبها خادمُنا. عاملُ الخدمة (public/sw.js) يحفظ هذه
  الصفحة عند تثبيته، ويقدّمها بدلاً من ذلك الجواب أو من انقطاع التنقّل والجهازُ متّصل —
  والرابطُ في شريط العنوان يبقى ما طلبه الزائر، فإعادةُ التحميل تفتحه هو نفسه.

  مستقلّةٌ تماماً: لا طلبَ خارجياً، والخطُّ Tajawal من الموقع نفسه إن كان محفوظاً وإلا
  خطُّ النظام. التصميم بابان كحليّان شبه مغلقين بحوافّ ذهبية يتنفّسان قليلاً، ومن الشقّ
  بينهما خيطُ ضوء؛ قوسهما معاً قوسُ العلامة، والحلقة نصفان على البابين (public/favicon.svg).

  تسأل /api/ready كل ثلاث ثوانٍ (وتتباطأ تدريجياً إلى خمس عشرة)، فإذا أجاب أعادت فتح
  الصفحة المطلوبة. وإن أُعيد التحميل ثلاثَ مرّاتٍ في دقيقتين والخادمُ يجيب، تباطأت إلى
  مرّةٍ كل نصف دقيقة ولا تدور في حلقة.

  السكربت المضمَّن مسموحٌ ببصمته وحدها: server/updating-page.ts يحسب sha256 له ويضعه في
  ترويسة CSP لهذا الملف، فلا يلزم توسيع سياسة الموقع العامة (script-src 'self').
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f4ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070d18" media="(prefers-color-scheme: dark)">
<title>البوابة تُفتح بعد قليل · مجال</title>
<style>
@font-face{font-family:"Tajawal";font-weight:500;font-display:swap;src:local("Tajawal Medium"),url("/fonts/4255019c1c.woff2") format("woff2")}
@font-face{font-family:"Tajawal";font-weight:700;font-display:swap;src:local("Tajawal Bold"),url("/fonts/fa5e723266.woff2") format("woff2")}
:root{
  /* المحيط حول البابين: كريمُ الثيم الفاتح في مجال. البابان كحليّان في الثيمين. */
  --ground:#f7f4ec;--ground-top:#fbf8f1;--ground-bottom:#efe8d8;--frame:rgba(11,18,32,.10);--floor:rgba(125,97,43,.30);
  --door-a:#18243a;--door-b:#0f172a;--door-c:#0b1220;
  --edge:#a8843c;--edge-hi:#e8c880;--mould:rgba(232,200,128,.17);
  --light:#fff3cf;--glow:rgba(244,225,176,.55);--spill:rgba(199,165,91,.30);
  --ink:#f8f4ea;--muted:#b9c3d4;--eyebrow:#e8c880;
  --cta:#c7a55b;--cta-hover:#d4b46a;--cta-ink:#0b1220;
  --shadow:0 30px 60px rgba(11,18,32,.28),0 8px 18px rgba(11,18,32,.16);
  --open:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ground:#070d18;--ground-top:#0a101b;--ground-bottom:#05090f;--frame:rgba(255,255,255,.06);--floor:rgba(232,200,128,.22);
    --door-a:#1d2b44;--door-b:#131c2d;--door-c:#0f172a;
    --edge:#c7a55b;--edge-hi:#f4e1b0;--mould:rgba(232,200,128,.14);
    --glow:rgba(232,200,128,.5);--spill:rgba(232,200,128,.22);
    --shadow:0 30px 70px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;min-height:100%;overflow-x:hidden;
  padding:max(16px,env(safe-area-inset-top)) 16px max(26px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,var(--ground-top) 0%,var(--ground) 55%,var(--ground-bottom) 100%);
  background-color:var(--ground);color:var(--ink);
  font-family:"Tajawal","Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,-apple-system,sans-serif;
  font-weight:500;font-synthesis:none;-webkit-font-smoothing:antialiased;
}
/* البابان معاً قوسُ العلامة: نصف قطر الركن الخارجي العلوي = عرضُ الباب الواحد. */
.gate{
  --w:min(100vw - 32px,760px);--arch:calc(var(--w) / 2);
  position:relative;width:var(--w);margin:0 auto;
  height:calc(100vh - max(16px,env(safe-area-inset-top)) - max(26px,env(safe-area-inset-bottom)));
  height:calc(100dvh - max(16px,env(safe-area-inset-top)) - max(26px,env(safe-area-inset-bottom)));
  min-height:600px;display:grid;grid-template-columns:1fr 1fr;
}
/* ما خلف البابين: عتمةٌ بشكل القوس نفسه، فيُقرأ خيط الضوء في الثيمين. */
.gate::before{content:"";position:absolute;inset:0;border-radius:var(--arch) var(--arch) 0 0;background:#04070d}
/* خطّ الأرض تحت البوابة، وبقعةُ الضوء التي تنسكب من الشقّ عليه. */
.gate::after{content:"";position:absolute;inset-inline:-8px;bottom:-9px;height:2px;border-radius:2px;background:var(--floor)}
.spill{position:absolute;left:50%;bottom:-26px;width:min(64%,320px);height:34px;transform:translateX(-50%);
  background:radial-gradient(50% 60% at 50% 30%,var(--spill),transparent 72%);opacity:.6;pointer-events:none;
  animation:spill 6.4s cubic-bezier(.65,0,.35,1) infinite}
/* خيطُ الضوء خلف البابين: لا يُرى إلا من الشقّ. */
.light{position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%);border-radius:2px;
  background:linear-gradient(180deg,transparent 0,var(--light) 9%,var(--light) 92%,rgba(255,243,207,.6) 100%);
  box-shadow:0 0 10px 2px var(--glow),0 0 34px 8px var(--glow)}
.door{
  position:relative;z-index:1;display:grid;align-content:end;gap:0;min-width:0;
  padding:0 clamp(16px,4.4vw,40px) clamp(26px,6vh,56px);
  background:linear-gradient(180deg,var(--door-a) 0%,var(--door-b) 46%,var(--door-c) 100%);
  border:1px solid var(--edge);box-shadow:var(--shadow);
  animation:breathe 6.4s cubic-bezier(.65,0,.35,1) infinite;
}
/* الإطار المحفور داخل كل باب. */
.door::before{content:"";position:absolute;inset:12px;border:1px solid var(--mould);pointer-events:none}
/* الحافّة الذهبية عند الشقّ أعرض قليلاً: هي ما يلتقط الضوء. */
.door::after{content:"";position:absolute;top:0;bottom:0;width:3px;pointer-events:none;
  background:linear-gradient(180deg,var(--edge-hi),var(--edge) 40%,var(--edge) 80%,var(--edge-hi))}
.door.r{border-start-start-radius:var(--arch);--dir:1;transform-origin:right center}
.door.r::before{border-start-start-radius:calc(var(--arch) - 12px)}
.door.r::after{left:-1px}
.door.l{border-start-end-radius:var(--arch);--dir:-1;justify-items:start}
.door.l::before{border-start-end-radius:calc(var(--arch) - 12px)}
.door.l::after{right:-1px}
/* حلقةُ العلامة نصفان، نصفٌ على كل باب، فتلتئم حين يُغلقان. */
.ring{position:absolute;top:calc(var(--arch) + 34px);width:30px;height:60px;border:6px solid var(--edge);
  box-shadow:0 6px 14px rgba(0,0,0,.28);pointer-events:none}
.door.r .ring{left:-1px;border-left:0;border-radius:0 60px 60px 0}
.door.l .ring{right:-1px;border-right:0;border-radius:60px 0 0 60px}
.copy,.act{position:relative;max-width:300px}
.door.r .copy{justify-self:end;width:100%}
.eyebrow{margin:0 0 14px;font-size:11px;font-weight:700;letter-spacing:.32em;color:var(--eyebrow);direction:ltr;text-align:right}
h1{margin:0;font-size:clamp(21px,5.8vw,30px);font-weight:700;line-height:1.42;color:var(--ink);text-wrap:balance}
.lead{margin:12px 0 0;font-size:14.5px;line-height:1.75;color:var(--muted)}
.act{display:grid;justify-items:start;gap:12px}
button{
  min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;border:0;
  background:var(--cta);color:var(--cta-ink);font:inherit;font-size:14px;font-weight:700;
  box-shadow:0 10px 26px rgba(199,165,91,.22);
  transition:background-color .14s ease,transform .24s cubic-bezier(.16,1,.3,1);
}
button:hover{background:var(--cta-hover)}
button:active{transform:scale(.98)}
button:focus-visible{outline:2px solid var(--edge-hi);outline-offset:3px}
.note{min-height:20px;margin:0;text-wrap:pretty;font-size:12.5px;line-height:1.7;color:var(--muted)}
/* «شبه مغلقين»: ينفرجان بضع بكسلات ثم يعودان، والضوء على الأرض يتبعهما. */
@keyframes breathe{0%,100%{transform:translateX(calc(var(--dir) * 0px))}50%{transform:translateX(calc(var(--dir) * 5px))}}
@keyframes spill{0%,100%{opacity:.45;transform:translateX(-50%) scaleX(.7)}50%{opacity:1;transform:translateX(-50%) scaleX(1)}}
@media (max-width:420px){.door{padding-inline:16px 14px}.door.l{padding-inline:14px 16px}.lead{font-size:14px}}
@media (max-height:640px){.ring{display:none}}
@media (prefers-reduced-motion:reduce){
  .door,.spill{animation:none}
  .door.r{transform:translateX(3px)}.door.l{transform:translateX(-3px)}
  .spill{opacity:.8}
}
</style>
</head>
<body>
<main class="gate">
  <span class="light" aria-hidden="true"></span>
  <section class="door r">
    <span class="ring" aria-hidden="true"></span>
    <div class="copy">
      <p class="eyebrow" aria-hidden="true">MAJAL</p>
      <h1 id="title">تُفتح البوابة من جديد بعد قليل</h1>
      <p class="lead" id="lead">نُجري تحديثاً على مجال خلف هذا الباب.</p>
    </div>
  </section>
  <section class="door l">
    <span class="ring" aria-hidden="true"></span>
    <div class="act">
      <button type="button" id="retry">حاول الدخول الآن</button>
      <p class="note" id="note" role="status" aria-live="polite">حين تُفتح، نُدخلك إلى الصفحة التي طلبتها دون أن تفعل شيئاً.</p>
    </div>
  </section>
  <span class="spill" aria-hidden="true"></span>
</main>
<script>
(function () {
  var HEALTH = "/api/ready";
  var FIRST = 3000, CEILING = 15000, PATIENT = 30000;
  var KEY = "majal-updating-reloads";
  var tries = 0, timer = 0, asking = false;
  var title = document.getElementById("title");
  var lead = document.getElementById("lead");
  var note = document.getElementById("note");

  /* إعاداتُ التحميل في الدقيقتين الأخيرتين: ثلاثٌ والخادمُ يجيب تعني أن الصفحة
     نفسها تتعثّر، فلا ندور في حلقة. */
  function recent() {
    try {
      var now = Date.now();
      return JSON.parse(sessionStorage.getItem(KEY) || "[]").filter(function (t) { return now - t < 120000; });
    } catch (e) { return []; }
  }
  function remember() {
    try { var list = recent(); list.push(Date.now()); sessionStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {}
  }
  function stuck() { return recent().length >= 3; }

  /* فُتحت هذه الصفحة باسمها مباشرة: العودة إلى البداية، لا إليها. */
  function reopen() {
    if (location.pathname === "/updating.html") location.replace("/");
    else location.reload();
  }

  function describe() {
    if (navigator.onLine === false) {
      title.textContent = "لا اتصال يبلغ البوابة الآن";
      lead.textContent = "تحقّق من الإنترنت، ونُكمل دخولك حين يعود الاتصال.";
      note.textContent = "";
    } else if (stuck()) {
      title.textContent = "تُفتح البوابة من جديد بعد قليل";
      lead.textContent = "يأخذ تحديث مجال وقتاً أطول مما قدّرنا.";
      note.textContent = "نطرق الباب مرّةً كل نصف دقيقة، ولك أن تحاول الآن.";
    } else {
      title.textContent = "تُفتح البوابة من جديد بعد قليل";
      lead.textContent = "نُجري تحديثاً على مجال خلف هذا الباب.";
      note.textContent = "حين تُفتح، نُدخلك إلى الصفحة التي طلبتها دون أن تفعل شيئاً.";
    }
  }

  function wait() {
    if (stuck()) return PATIENT;
    return Math.min(CEILING, Math.round(FIRST * Math.pow(1.3, Math.max(0, tries - 5))));
  }
  function later() { clearTimeout(timer); timer = setTimeout(ask, wait()); }

  function ask() {
    clearTimeout(timer);
    if (asking) return;
    if (navigator.onLine === false) { describe(); later(); return; }
    asking = true;
    tries++;
    var control = typeof AbortController === "function" ? new AbortController() : null;
    var guard = setTimeout(function () { if (control) control.abort(); }, 8000);
    fetch(HEALTH, { cache: "no-store", credentials: "same-origin", signal: control ? control.signal : undefined })
      .then(function (response) { return response.ok; }, function () { return false; })
      .then(function (ok) {
        clearTimeout(guard);
        asking = false;
        if (ok) { remember(); reopen(); return; }
        describe();
        later();
      });
  }

  document.getElementById("retry").addEventListener("click", reopen);
  window.addEventListener("online", function () { describe(); ask(); });
  window.addEventListener("offline", describe);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) ask(); });

  describe();
  later();
})();
</script>
</body>
</html>
