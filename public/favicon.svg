<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="مجال">
  <!-- The MAJAL gate: a licensed gateway (the arch) holding the creator's idea (the ring),
       which also carries the loop of «م». Pure geometry — the previous favicon set a text
       glyph, so it rendered in a different typeface on every operating system. -->
  <defs>
    <linearGradient id="majal-favicon-gold" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a8843c"/>
      <stop offset="45%" stop-color="#c7a55b"/>
      <stop offset="100%" stop-color="#f4e1b0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0b1220"/>
  <g transform="translate(32 33.5) scale(0.78) translate(-32 -33.5)" fill="none" stroke="url(#majal-favicon-gold)" stroke-linecap="round">
    <path d="M11 53 V33 A21 21 0 0 1 53 33 V53" stroke-width="6.5"/>
    <circle cx="32" cy="34" r="9" stroke-width="6"/>
  </g>
</svg>
