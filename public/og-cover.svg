<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="مجال — من الفكرة إلى منتج تجاري">
  <!-- Link-preview card. Rebuilt around the drawn mark: the old version leaned on a text
       glyph for the logo, and preview renderers substitute their own font, so the brand
       arrived differently on every platform. Everything identifying is geometry now; only
       the headline is type, and it carries a full fallback stack. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a101b"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#070d18"/>
    </linearGradient>
    <linearGradient id="gold" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a8843c"/>
      <stop offset="45%" stop-color="#c7a55b"/>
      <stop offset="100%" stop-color="#f4e1b0"/>
    </linearGradient>
    <linearGradient id="goldText" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#c7a55b"/>
      <stop offset="50%" stop-color="#e8c880"/>
      <stop offset="100%" stop-color="#f8ecd0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c7a55b" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#c7a55b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="150" r="330" fill="url(#glow)"/>
  <circle cx="160" cy="580" r="240" fill="url(#glow)" opacity="0.55"/>

  <!-- The mark, seated in its own field of concentric rings — the same monument the
       landing hero uses, so the preview and the page agree. -->
  <g transform="translate(1004 152)">
    <circle r="118" fill="none" stroke="#c7a55b" stroke-opacity="0.14"/>
    <circle r="88" fill="none" stroke="#c7a55b" stroke-opacity="0.10"/>
    <!-- scale then translate: the mark's own optical centre (32, 36) lands on the
         group origin, which is the centre of the rings above. -->
    <g transform="scale(1.72) translate(-32 -36)" fill="none" stroke="url(#gold)" stroke-linecap="round">
      <path d="M11 53 V33 A21 21 0 0 1 53 33 V53" stroke-width="6.5"/>
      <circle cx="32" cy="34" r="9" stroke-width="6"/>
      <path d="M7 57.5 H57" stroke-width="4.5" opacity="0.3"/>
    </g>
  </g>

  <g font-family="'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif" text-anchor="end">
    <text x="1120" y="330" font-size="78" font-weight="700" fill="#f8fafc">حوّل الموهبة إلى</text>
    <text x="1120" y="424" font-size="78" font-weight="700" fill="url(#goldText)">منتج تجاري حقيقي</text>
    <text x="1120" y="484" font-size="30" fill="#94a3b8">منصة تشغيل الشراكات بين المبدعين والمنشآت المرخّصة</text>
  </g>

  <path d="M80 546 H1120" stroke="#c7a55b" stroke-opacity="0.18" stroke-width="1"/>

  <g font-family="'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, system-ui, sans-serif" font-size="24" font-weight="600" fill="#94a3b8">
    <text x="1120" y="588" text-anchor="end">ابتكار · حماية · مطابقة · مختبر · اتفاق · إطلاق</text>
    <text x="80" y="588" text-anchor="start" letter-spacing="8" fill="#c7a55b" fill-opacity="0.75" font-size="20">MAJAL</text>
  </g>
</svg>
