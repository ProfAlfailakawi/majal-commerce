# ينشر مجال إلى Cloud Run عند كل دفع إلى main.
#
# لماذا هذا الملف موجود:
#   المستودع يحمل سكربت نشر (`scripts/deploy-cloud-run.sh`) لكنه كان يُشغَّل
#   باليد فقط. فكل ما يُدمج في main يبقى في GitHub ولا يصل إلى الخدمة — ومنه
#   البيئة التجريبية: تُدمج، ولا تظهر على الموقع الحيّ أبدًا.
#
# الوجهة مأخوذة من رابط الخدمة الحيّ نفسه:
#   majal-app-522016905178.europe-west2.run.app
# أي الخدمة `majal-app` في المشروع رقم 522016905178 (tebyan-clean-2026-5f13b)
# بمنطقة europe-west2 — لا مشروع majal-b6309، فذاك مشروع Firebase لا موضع
# الخدمة، ونشرٌ عليه لا يغيّر شيئًا في الموقع الذي يفتحه الناس.

name: نشر مجال إلى Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: majal-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tebyan-clean-2026-5f13b
  CLOUD_RUN_SERVICE: majal-app
  GCP_REGION: europe-west2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: تثبيت الحزم
        run: npm ci

      # لا نشر فوق فحصٍ أحمر.
      - name: فحص الأنواع
        run: npm run lint

      - name: الاختبارات
        run: npm test

      # إعدادٌ لمرة واحدة لم يُنفَّذ بعد ليس عطبًا في هذا التغيير: لا شيء انكسر، ولا
      # شيء يُصلَح في الشيفرة. و`exit 1` كان يضع علامةً حمراء على كل دمجٍ إلى الأبد،
      # فتفقد العلامة معناها ولا يُميَّز بعدها فشلٌ حقيقي حين يقع.
      #
      # فتقف المهمة وتقول لماذا — تنبيهٌ على صفحة التشغيل وملخّصٌ مقروء — ولا تدّعي
      # نشرًا لم يقع: كل خطوة بعدها مشروطة بأن الهوية مضبوطة.
      - name: التحقق من إعداد هوية النشر
        id: identity
        shell: bash
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          MISSING=""
          if [[ -z "$WIF_PROVIDER" ]]; then MISSING="$MISSING GCP_WORKLOAD_IDENTITY_PROVIDER"; fi
          if [[ -z "$DEPLOY_SERVICE_ACCOUNT" ]]; then MISSING="$MISSING GCP_DEPLOY_SERVICE_ACCOUNT"; fi
          if [[ -n "$MISSING" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=لم يُنشر شيء::هوية النشر غير مُعدّة بعد. الخطوات في docs/deploy-majal.md"
            {
              echo "## لم يُنشر شيء — والتغيير سليم"
              echo ""
              echo "الفحوص مرّت، ولم يُنشر شيء لأن **هوية النشر غير مُعدّة بعد**."
              echo "هذا إعدادٌ لمرة واحدة على صاحب المستودع، لا عطبٌ في هذا التغيير."
              echo ""
              echo "الناقص:$MISSING"
              echo ""
              echo "الخطوات في \`docs/deploy-majal.md\`، ثم تُضاف القيم في:"
              echo "Settings → Secrets and variables → Actions → **Variables**"
              echo ""
              echo "وبمجرد إضافتها يمضي النشر تلقائيًا عند الدمج التالي بلا تعديلٍ هنا."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: مصادقة Google Cloud بلا مفتاح دائم
        if: steps.identity.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.identity.outputs.configured == 'true'
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      # لا يُمرَّر `--set-env-vars` ولا `--set-secrets` عمدًا: تمريرهما يستبدل ما
      # هو مضبوط على الخدمة اليوم، والنشر لا يجوز أن يمحو إعدادًا لم يطلب أحد
      # تغييره. نحدّث الشيفرة وحدها.
      - name: نشر الخدمة
        if: steps.identity.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # `--clear-base-image` ليس زينة: الخدمة القائمة نُشرت سابقًا بصورة
          # أساس تُحدّثها Cloud Run تلقائيًا، وهذا لا يجتمع مع بناءٍ من
          # `Dockerfile` في المستودع. فيرفض gcloud النشر صراحةً:
          #
          #   Missing required argument [--clear-base-image]: Base image is not
          #   supported for services built from Dockerfile.
          #
          # والمستودع يحمل `Dockerfile`، وهو ما يُبنى منه فعلًا. فتُمسح صورة
          # الأساس المخزَّنة مرةً، ويبقى البناء على ملف المستودع وحده — وهو
          # المصدر الذي تمرّ عليه الفحوص قبل النشر.
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --clear-base-image \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --quiet

      - name: التحقق أن الخدمة تردّ بعد النشر
        if: steps.identity.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
                  --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
                  --format='value(status.url)')"
          echo "URL: $URL"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/")"
          echo "HTTP $CODE"
          # نشرٌ ينتهي بخدمةٍ لا تردّ ليس نشرًا ناجحًا، وإن قال gcloud إنه تمّ.
          [[ "$CODE" =~ ^(200|30[0-9])$ ]] || { echo "الخدمة لا تردّ بعد النشر." >&2; exit 1; }
