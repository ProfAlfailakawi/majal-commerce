<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>مجال | من الفكرة إلى منتج تجاري</title>
    <meta name="description" content="مجال — منصة كويتية لتحويل ابتكارات المبدعين إلى منتجات تجارية عبر منشآت مرخّصة: اكتشاف، حماية، مختبر، تعاقد، إطلاق ومستحقات في مسار واحد." />
    <meta name="theme-color" content="#0b1220" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Arabic type. Preconnect first so the font handshake overlaps the bundle fetch;
         display=swap keeps the first paint readable if the font is slow or blocked. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Link previews (WhatsApp, X, LinkedIn) render from these, not from the page body. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="مجال — MAJAL Platform" />
    <meta property="og:locale" content="ar_KW" />
    <meta property="og:title" content="مجال | من الفكرة إلى منتج تجاري" />
    <meta property="og:description" content="حوّل الموهبة إلى منتج تجاري حقيقي داخل منظومة احترافية واضحة الصلاحيات — عبر منشآت كويتية مرخّصة." />
    <meta property="og:image" content="/og-cover.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="مجال | من الفكرة إلى منتج تجاري" />
    <meta name="twitter:description" content="حوّل الموهبة إلى منتج تجاري حقيقي داخل منظومة احترافية واضحة الصلاحيات." />
    <meta name="twitter:image" content="/og-cover.svg" />

    <!-- ── Boot screen ───────────────────────────────────────────────────────────
         Inlined on purpose. The app is a lazy-chunked React SPA behind an auth
         restore round-trip, so the first meaningful paint used to be a bare navy
         rectangle for as long as the bundle took. This markup and its CSS ship in
         the HTML document itself, so the brand is on screen at first paint with no
         stylesheet, font, or script dependency — the SVG is geometry, and the layout
         does not shift when IBM Plex finally arrives.

         It is removed by src/main.tsx once React commits, with a failsafe timer
         below so a bundle that never executes can never leave a visitor staring at
         a locked screen. -->
    <style>
      #majal-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(199, 165, 91, 0.13) 0, transparent 46%),
          linear-gradient(180deg, #0a101b 0%, #0b1220 55%, #070d18 100%);
        opacity: 1;
        transition: opacity 520ms cubic-bezier(0.65, 0, 0.35, 1), visibility 0s linear 520ms;
      }

      .majal-ready #majal-splash {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #majal-splash .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        padding: 24px;
        text-align: center;
      }

      /* A slow gold sweep behind the mark. It is the only moving thing on the screen,
         so it reads as the product breathing rather than as a spinner. */
      #majal-splash .splash-halo {
        position: relative;
        display: grid;
        place-items: center;
        width: 168px;
        height: 168px;
      }

      #majal-splash .splash-halo::before {
        content: '';
        position: absolute;
        inset: -18%;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0deg, rgba(199, 165, 91, 0.26) 90deg, transparent 200deg);
        filter: blur(22px);
        animation: majal-splash-sweep 4.2s linear infinite;
      }

      #majal-splash .splash-halo::after {
        content: '';
        position: absolute;
        inset: 6%;
        border-radius: 50%;
        border: 1px solid rgba(199, 165, 91, 0.16);
      }

      #majal-splash svg {
        position: relative;
        width: 104px;
        height: 104px;
      }

      /* pathLength="1" on every stroke means one dashoffset tween draws all of them,
         independent of their real arc lengths. */
      #majal-splash svg [data-draw] {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: majal-splash-draw 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      #majal-splash svg [data-draw='core'] { animation-delay: 0.5s; }
      #majal-splash svg [data-draw='ground'] { animation-delay: 0.95s; }

      #majal-splash .splash-word {
        font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, 'Noto Sans Arabic', system-ui, sans-serif;
        font-size: 38px;
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(180deg, #f8ecd0 0%, #e8c880 55%, #c7a55b 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: majal-splash-rise 700ms cubic-bezier(0.16, 1, 0.3, 1) 0.75s both;
      }

      #majal-splash .splash-latin {
        margin-top: 10px;
        font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.52em;
        text-indent: 0.52em;
        color: rgba(199, 165, 91, 0.62);
        animation: majal-splash-rise 700ms cubic-bezier(0.16, 1, 0.3, 1) 0.88s both;
      }

      #majal-splash .splash-tagline {
        font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
        font-size: 13px;
        color: #64748b;
        animation: majal-splash-rise 700ms cubic-bezier(0.16, 1, 0.3, 1) 1.02s both;
      }

      #majal-splash .splash-rail {
        width: 132px;
        height: 2px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.07);
        animation: majal-splash-rise 500ms ease 1.1s both;
      }

      /* Deliberately indeterminate. Inventing a percentage for a bundle download that
         reports no progress is a lie the user can catch when it jumps to 100. */
      #majal-splash .splash-rail span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #e8c880, transparent);
        animation: majal-splash-rail 1.35s ease-in-out infinite;
      }

      @keyframes majal-splash-draw { to { stroke-dashoffset: 0; } }
      @keyframes majal-splash-sweep { to { transform: rotate(360deg); } }
      @keyframes majal-splash-rail {
        0% { transform: translateX(240%); }
        100% { transform: translateX(-240%); }
      }
      @keyframes majal-splash-rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (prefers-reduced-motion: reduce) {
        /* Zeroing the durations alone would freeze the mark at dashoffset 1 — an
           invisible logo — so the dashes are dropped and the finished glyph shows. */
        #majal-splash svg [data-draw] {
          stroke-dasharray: none;
          stroke-dashoffset: 0;
          animation: none;
        }
        #majal-splash .splash-halo::before,
        #majal-splash .splash-rail span { animation: none; }
        #majal-splash .splash-word,
        #majal-splash .splash-latin,
        #majal-splash .splash-tagline,
        #majal-splash .splash-rail { animation: none; opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div id="majal-splash" role="status" aria-live="polite" aria-label="جاري تجهيز منصة مجال">
      <div class="splash-inner">
        <span class="splash-halo">
          <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="majal-splash-gold" x1="1" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#a8843c" />
                <stop offset="45%" stop-color="#c7a55b" />
                <stop offset="100%" stop-color="#f4e1b0" />
              </linearGradient>
            </defs>
            <path data-draw="gate" d="M11 53 V33 A21 21 0 0 1 53 33 V53" stroke="url(#majal-splash-gold)" stroke-width="6.5" stroke-linecap="round" pathLength="1" />
            <circle data-draw="core" cx="32" cy="34" r="9" stroke="url(#majal-splash-gold)" stroke-width="6" pathLength="1" />
            <path data-draw="ground" d="M7 57.5 H57" stroke="url(#majal-splash-gold)" stroke-width="4.5" stroke-linecap="round" opacity="0.32" pathLength="1" />
          </svg>
        </span>

        <div>
          <div class="splash-word">مجال</div>
          <div class="splash-latin">MAJAL</div>
        </div>

        <div class="splash-tagline">من الفكرة إلى منتج تجاري</div>
        <div class="splash-rail"><span></span></div>
      </div>
    </div>

    <div id="root"></div>

    <noscript>
      <div style="padding:2rem;font-family:system-ui,sans-serif;color:#f8fafc;background:#0b1220;text-align:center;position:fixed;inset:0;z-index:10000">
        منصة مجال تحتاج إلى تفعيل JavaScript في المتصفح لعرض المحتوى.
      </div>
    </noscript>

    <script>
      // The boot timestamp lets main.tsx hold the splash for a minimum beat, so a warm
      // cache does not flash the brand for 80ms — a blink reads as a glitch, not a brand.
      window.__majalBootAt = Date.now();

      // Failsafe. If the bundle 404s, throws before mounting, or is blocked by an
      // extension, nothing else would ever clear this layer and the visitor would be
      // stuck on an animation forever. After 8s the splash lifts regardless, which at
      // worst reveals the app's own error boundary — an explainable screen instead of
      // a permanent one.
      window.setTimeout(function () {
        document.documentElement.classList.add('majal-ready');
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
